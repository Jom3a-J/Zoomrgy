modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Jom3a-J/Zoomrgy/issues"

[[mods]]
modId = "zoomrgy"
version = "${version}"
displayName = "Zoomrgy"
authors = "Jom3a"
logoFile = "assets/zoomrgy/icon.png"
description = '''
A fully-featured, highly configurable client-side zoom mod. Smooth FOV transitions with adjustable
speed and a choice of easing curves, scroll to change magnification on the fly, a rangefinder HUD,
target highlighting and fog reduction. Default keybind: C.
'''

[[mixins]]
config = "zoomrgy.mixins.json"

[[dependencies.zoomrgy]]
modId = "neoforge"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.zoomrgy]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.zoomrgy]]
modId = "cloth_config"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
