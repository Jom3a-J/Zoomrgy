plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "${project.archives_base_name}-fabric"
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases/" }  // Mod Menu
	maven { url "https://maven.shedaniel.me/" }                 // Cloth Config
}

// Compile the shared sources here rather than depending on a jar built elsewhere, so they are
// built against this loader's Minecraft.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

loom {
	mods {
		"zoomrgy" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "zoomrgy-test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// Minecraft 26.2 ships de-obfuscated, so there is no mappings dependency and no remap step.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Compile-only for the published mod, plus localRuntime so the config screen is reachable
	// in the dev client. localRuntime never leaks into the published dependencies.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.archives_base_name}" }
	}
}
