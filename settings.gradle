pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'zoomrgy'

// common/ is a plain source directory, not a Gradle project: each loader subproject compiles
// it against its own Minecraft, so there is nothing to build here on its own.
include 'fabric'
include 'neoforge'
